<div class="row">
    @for (movie of movies(); track movie.id) {
        <div class="col-md-3 mb-5 animate__animated animate__fadeIn">
            <img [src]="movie.poster_path | poster"
                class="img-fluid img-thumbnail poster"
                (click)="onMovieClick( movie )">
            <div class="text-white">
                <h5>{{ movie.title }} ({{movie.release_date | onlyYear}})</h5>
                <div class="row">
                    <div class="col-10 text-white">
                        <!--star-rating [value]="5" 
                                    [totalStars]="10" 
                                    [checkedcolor]="'yellow'"
                                    [uncheckedcolor]="'grey'">
                        </star-rating-->
                    </div>
                    <div class="col-2 text-white">
                        {{ movie.vote_average | number:'1.1-2' }}
                    </div>
                </div>
            </div>
        </div>
    }

    <p-paginator (onPageChange)="onPageChange($event)" 
                [first]="first" 
                [rows]="rows" 
                [totalRecords]="120"/>
</div>

<ng-template #loading>
    <p>Loading...</p>  <!-- Mensaje de carga mientras se obtienen los datos -->
</ng-template>
